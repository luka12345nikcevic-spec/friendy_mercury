# Friendy Mercury experiment config.
# Paths are resolved relative to this YAML file.

name: public-datasets
output_dir: ../runs/public-datasets

datasets:
  train:
    - name: chvg-dataset
      images: /home/luka/workspace/friendy_mercury/data/chvg_dataset/images
      labels: /home/luka/workspace/friendy_mercury/data/chvg_dataset/labels
      classes:
        - head
        - glass
        - red
        - yellow
        - blue
        - vest
        - person
        - white

    - name: kaggle-dataset
      images: /home/luka/workspace/friendy_mercury/data/kaggle_dataset/images
      labels: /home/luka/workspace/friendy_mercury/data/kaggle_dataset/labels
      classes:
        - Hardhat
        - Mask
        - NO-Hardhat
        - NO-Mask
        - NO-Safety Vest
        - Person
        - Safety Cone
        - Safety Vest
        - machinery
        - vehicle

    - name: ultralytics-dataset
      images: /home/luka/workspace/friendy_mercury/data/ultralytics_dataset/images
      labels: /home/luka/workspace/friendy_mercury/data/ultralytics_dataset/labels
      classes:
        - helmet
        - vest
        - goggles
        - Person
        - boots
        - gloves
        - no_boots
        - no_gloves
        - no_goggle
        - no_helmet
        - no_vest

  val:
    name: ultralytics-val
    images: /home/luka/workspace/friendy_mercury/data/ultralytics_dataset/images
    labels: /home/luka/workspace/friendy_mercury/data/ultralytics_dataset/labels
    classes:
      - helmet
      - vest
      - goggles
      - Person
      - boots
      - gloves
      - no_boots
      - no_gloves
      - no_goggle
      - no_helmet
      - no_vest

  test:
    name: test_0
    images: /home/luka/workspace/friendy_mercury/data/test_dataset_0/images
    labels: /home/luka/workspace/friendy_mercury/data/test_dataset_0/labels
    classes:
      - gloves
      - goggles
      - helmet
      - no_gloves
      - no_goggles
      - no_helmet
      - no_vest
      - vest

models:
  - name: retinanet
    num_classes: auto
    variant: resnet50_fpn_v2
    weights_backbone: DEFAULT
    weights: null
    trainable_backbone_layers: null

  - name: yolox
    num_classes: auto
    variant: yolox-nano
    weights: null
    score_threshold: 0.3
    nms_threshold: 0.45
    act: silu

  - name: rtdetr
    num_classes: auto
    weights: PekingU/rtdetr_r50vd
    score_threshold: 0.5
    image_mean: [0.485, 0.456, 0.406]
    image_std: [0.229, 0.224, 0.225]
    ignore_mismatched_sizes: true

training:
  epochs: 100
  batch_size: 4
  num_workers: 4
  device: auto
  seed: 42
  amp: false
  gradient_clip_norm: null
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
    params: {}
  scheduler: null

evaluation:
  batch_size: 4
  num_workers: 4
  score_threshold: 0.001
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
